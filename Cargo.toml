[workspace]
resolver = "3"
members = [
    "crates/ir-proto",
    "crates/ir-geometry",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.90"
authors = ["InputRemote contributors"]
license = "MIT"
repository = "https://github.com/inputremote/inputremote"

[workspace.dependencies]
# Núcleo puro — sem E/S. Ver docs/02-arquitetura.md §2.
ir-proto = { path = "crates/ir-proto", version = "0.1.0-dev" }
ir-geometry = { path = "crates/ir-geometry", version = "0.1.0-dev" }

postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = "2.0"

# Ferramentas de desenvolvimento (xtask)
anyhow = "1.0"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# docs/09-padroes-de-codigo.md §5 — proibidos fora de testes.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Ruído sem valor para este projeto.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# O caminho quente é medido em release; dev só precisa compilar rápido.
opt-level = 0
