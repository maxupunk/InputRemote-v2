[workspace]
resolver = "3"
members = [
    "crates/ir-proto",
    "crates/ir-geometry",
    "crates/ir-session",
    "crates/ir-crypto",
    "crates/ir-ipc",
    "crates/ir-net",
    "crates/ir-bt",
    "crates/ir-transporte",
    "crates/ir-files",
    "crates/ir-transferencia",
    "crates/ir-clip",
    "crates/ir-input",
    "crates/ir-daemon",
    "crates/ir-agent",
    "crates/ir-ui",
    "xtask",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.90"
authors = ["InputRemote contributors"]
license = "MIT"
repository = "https://github.com/inputremote/inputremote"

[workspace.dependencies]
# Núcleo puro — sem E/S. Ver docs/02-arquitetura.md §2.
ir-proto = { path = "crates/ir-proto", version = "0.1.0-dev" }
ir-geometry = { path = "crates/ir-geometry", version = "0.1.0-dev" }
ir-session = { path = "crates/ir-session", version = "0.1.0-dev" }
ir-crypto = { path = "crates/ir-crypto", version = "0.1.0-dev" }
ir-ipc = { path = "crates/ir-ipc", version = "0.1.0-dev" }
ir-net = { path = "crates/ir-net", version = "0.1.0-dev" }
ir-bt = { path = "crates/ir-bt", version = "0.1.0-dev" }
ir-transporte = { path = "crates/ir-transporte", version = "0.1.0-dev" }
ir-files = { path = "crates/ir-files", version = "0.1.0-dev" }
ir-transferencia = { path = "crates/ir-transferencia", version = "0.1.0-dev" }
ir-clip = { path = "crates/ir-clip", version = "0.1.0-dev" }
ir-input = { path = "crates/ir-input", version = "0.1.0-dev" }

postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = "2.0"

# Criptografia e rede (crates de E/S — fora do núcleo puro)
snow = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
blake3 = "1.5"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
mdns-sd = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Ferramentas de desenvolvimento (xtask) e binários
anyhow = "1.0"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# docs/09-padroes-de-codigo.md §5 — proibidos fora de testes.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Ruído sem valor para este projeto.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# O caminho quente é medido em release; dev só precisa compilar rápido.
opt-level = 0
