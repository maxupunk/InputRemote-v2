[package]
name = "ir-daemon"
description = "O serviço: dono do estado, junta rede, criptografia e entrada em volta da sessão."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "inputremote-daemon"
path = "src/main.rs"

[dependencies]
ir-proto.workspace = true
# O arranjo local em pixels, para prender o ponteiro onde a sessão mandou.
ir-geometry.workspace = true
ir-session.workspace = true
ir-crypto.workspace = true
# O serviço não fala com `ir-net` nem com `ir-bt` direto: ele pede a um transporte, e quem sabe
# que existem dois é o `ir-transporte`. Foi a ausência dessa fronteira que deixou o serviço
# mandando pela rede o que a sessão marcara como Bluetooth.
ir-transporte.workspace = true
ir-transferencia.workspace = true
# Quem conectou, e o que pode: o portão de cada canal e a identificação do cliente do pipe.
ir-acesso.workspace = true
ir-input.workspace = true
# Lançar o agente e o ajudante de clipboard na sessão do usuário, no Windows, e zelar por eles.
ir-sessao.workspace = true
# O que a máquina guarda em disco: configuração e identidade.
ir-configuracao.workspace = true
# Os canais locais: o de controle, da interface, e o do agente.
ir-canais.workspace = true
# A economia de energia do Wi-Fi: o aviso e o botão que a desliga.
ir-energia.workspace = true
ir-ipc.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
# O processo visto pelo sistema: SCM, registro, suspensão e tela bloqueada.
ir-servico.workspace = true
# O que a janela vê: o retrato do serviço traduzido no estado publicado.
ir-painel.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
# A semente das épocas de sessão. O núcleo não sorteia nada; o serviço sorteia uma por sessão
# criada, para uma sessão nova nunca ser confundida com a anterior pelo par (log 22).
rand.workspace = true

# Só o que o lançamento do agente na sessão do usuário exige: token, sessão de console e
# criação de processo. Nada de entrada — quem captura e injeta é o agente.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    # O descritor de segurança dos canais de IPC, escrito em SDDL: é o que decide quem pode
    # falar com o serviço, e sem ele o padrão do SYSTEM tranca a própria interface do lado de fora.
    "Win32_Security_Authorization",
    # O ambiente do usuário para o ajudante de clipboard, lançado com o token dele.
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
]

# Só para entregar o socket de controle ao grupo que a interface do usuário alcança. O serviço
# roda como root, e sem isso o socket nasce root:root — trancando a própria janela do lado de fora.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
