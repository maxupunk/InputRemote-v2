[package]
name = "ir-daemon"
description = "O serviço: dono do estado, junta rede, criptografia e entrada em volta da sessão."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "inputremote-daemon"
path = "src/main.rs"

[dependencies]
ir-proto.workspace = true
ir-session.workspace = true
ir-crypto.workspace = true
ir-net.workspace = true
ir-input.workspace = true
ir-ipc.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true

# O despachante do Gerenciador de Serviços (SCM). Só no Windows: é ele quem faz o serviço
# responder ao "iniciar" do instalador, em vez de o `StartService` estourar o tempo — que é
# exatamente a falha "Service failed to start" da instalação.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[lints]
workspace = true
