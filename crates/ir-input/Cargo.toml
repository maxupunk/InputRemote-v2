[package]
name = "ir-input"
description = "Captura e injeção de entrada, com backends por sistema operacional."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ir-proto.workspace = true
tracing.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    # Uma thread por desktop, para injetar na tela de bloqueio e no UAC (ADR-0008).
    "Win32_System_StationsAndDesktops",
    # `LockWorkStation`, para bloquear junto com o par.
    "Win32_System_Shutdown",
]

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
# `poll` e `eventfd`: a thread de cada dispositivo acorda na hora em que a supressão muda.
libc = "0.2"

[lints]
workspace = true
