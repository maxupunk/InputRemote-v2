[package]
name = "ir-servico"
description = "O serviço visto pelo sistema operacional: SCM, registro, suspensão e tela bloqueada."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
ir-processo.workspace = true

[target.'cfg(windows)'.dependencies]
# O despachante do Gerenciador de Serviços (SCM): é ele quem faz o serviço responder ao "iniciar"
# do instalador, em vez de o `StartService` estourar o tempo.
windows-service = "0.7"
# A pasta de estado fechada aos outros usuários, com o DACL protegido.
ir-acesso.workspace = true
# Marcar que este processo é o serviço, na sessão 0.
ir-sessao.workspace = true

[lints]
workspace = true
