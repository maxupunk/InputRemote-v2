[package]
name = "ir-agent"
description = "O agente de sessão: captura e injeta a mando do serviço, e cuida do clipboard do usuário."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# O nome do executável é o de `docs/00-indice.md`, e é o que o instalador procura.
[[bin]]
name = "inputremote-agent"
path = "src/main.rs"

[dependencies]
ir-proto.workspace = true
ir-ipc.workspace = true
ir-input.workspace = true
ir-clip.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# O registro por fila, e um arquivo por dia no Windows: sem console, a saída padrão do agente e do
# ajudante de clipboard não chega a lugar nenhum, e uma falha deles ficava invisível.
tracing-appender.workspace = true
anyhow.workspace = true
# O nome da imagem de clipboard em trânsito leva parte do resumo dela.
blake3.workspace = true

[lints]
workspace = true
