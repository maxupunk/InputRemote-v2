[package]
name = "ir-clip"
description = "O clipboard do sistema: modelos canônicos e backends por SO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ir-proto.workspace = true
# Para o resumo que sustenta a guarda de eco. O mesmo BLAKE3 do `ir-files`, e não um `Hash` do
# `std`: aquele não promete estabilidade entre execuções, e esta comparação precisa valer.
blake3.workspace = true
# A imagem canônica é PNG, e o Windows a quer em DIB: codificar e decodificar é daqui.
png.workspace = true
tracing.workspace = true
thiserror.workspace = true

# `AddClipboardFormatListener` e os formatos do Win32. WinRT não serve: o clipboard pertence ao
# agente do desktop `Default`, e as APIs `Windows.ApplicationModel.DataTransfer` dependem de
# infraestrutura por usuário (docs/05-windows.md §6).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    # `WNDCLASSW` tem campos de ícone, cursor e pincel; sem GDI ela não existe no crate.
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
]

[lints]
workspace = true
