[package]
name = "ir-ui"
description = "A janela de configuração. Não conhece o produto — só o contrato de ir-ipc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# O nome do executável é o de `docs/00-indice.md`, não o do crate. `ir-ui` é como o código se
# organiza; `inputremote-ui` é como o usuário encontra o programa no menu iniciar.
[[bin]]
name = "inputremote-ui"
path = "src/main.rs"

[dependencies]
ir-ipc.workspace = true
slint = "1.14"

[build-dependencies]
slint-build = "1.14"

# So no Windows, e so na maquina que compila: e ela quem tem o `rc.exe` do SDK.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
