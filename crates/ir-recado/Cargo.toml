[package]
name = "ir-recado"
description = "O recado fora da janela: a notificação do sistema, no Windows e no Linux, e o ícone da bandeja."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Só o vocabulário: a cópia de arquivos (`Transferencia`), que é o recado mais comum.
ir-ipc.workspace = true
# Os quadros do ícone da bandeja são PNG embutidos, nos dois sistemas.
png.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# O registro conta quando o `notify-send` ou o barramento faltam.
tracing.workspace = true
# O barramento da sessão: o andamento no dock e o "mostrar na pasta". O mesmo `zbus` que o Slint já
# traz no Linux, com o mesmo motor (`async-io`), e a API bloqueante, que é a do ajudante.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# O ícone na bandeja (`StatusNotifierItem`, com o menu `dbusmenu`), sobre o mesmo `zbus`.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
# A central de notificações do Windows, com barra de andamento (`src/central.rs`).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Data_Xml_Dom", "UI_Notifications"] }
# O nome e o ícone do InputRemote na central, registrados por usuário, sem `unsafe`.
windows-registry = "0.6"
# O tamanho dos ícones da bandeja nesta escala de tela (`GetSystemMetrics`).
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
# Os quadros do ícone da bandeja, prontos para o ícone que a interface põe lá.
tray-icon = { version = "0.25", default-features = false }

[lints]
workspace = true
