[package]
name = "ir-net"
description = "Transporte UDP de entrada e descoberta mDNS. Move os quadros cifrados pelo socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ir-proto.workspace = true
ir-crypto.workspace = true
tokio.workspace = true
if-addrs.workspace = true
tracing.workspace = true
thiserror.workspace = true
# O keepalive do TCP de arquivos: o `tokio` não expõe o intervalo das sondas. `all` traz o
# `TCP_USER_TIMEOUT` do Linux, o prazo dos dados enviados e não confirmados.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "sync"] }

[lints]
workspace = true
